syntax = "proto3";

package standards.open.v1;

option go_package = "go.alis.build/common/standards/open/v1";

// Y / N requiring no further explanation
//
// `N` is the zero value, so an unset field reads as No: an unanswered question
// cannot be told apart from an explicit No.
enum YesNo {
  // No. Also the value of an unset field.
  N = 0;
  // Yes
  Y = 1;
  // Not Applicable
  NA = 2;
}

// Response where a NO requires further information
message YesNoExplain {
  // Yes or no answer.
  enum Response {
    // Not answered.
    RESPONSE_UNSPECIFIED = 0;
    // Yes. No explanation is needed.
    YES = 1;
    // No. Give the reason in `explanation`.
    NO = 2;
  }
  // Yes / No response.
  Response response = 1;
  // Explanation if the answer is `NO`
  string explanation = 2;
}
// Response where a YES requires further information
message YesExplainNo {
  // Yes or no answer.
  enum Response {
    // Not answered.
    RESPONSE_UNSPECIFIED = 0;
    // Yes. Give the details in `explanation`.
    YES = 1;
    // No. No explanation is needed.
    NO = 2;
  }
  // Yes / No response.
  Response response = 1;
  // Explanation if the answer is `YES`
  string explanation = 2;
}
// Response where further information is required regardless of whether a Yes or No is provided
message YesNoAndExplain {
  // Yes or no answer.
  enum Response {
    // Not answered.
    RESPONSE_UNSPECIFIED = 0;
    // Yes. Give further information in `explanation`.
    YES = 1;
    // No. Give further information in `explanation`.
    NO = 2;
  }
  // Yes / No response.
  Response response = 1;
  // Provide further information for the response
  string explanation = 2;
}